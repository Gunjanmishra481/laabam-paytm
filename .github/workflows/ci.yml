name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs read the code and nothing else unless they say so.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA (the tag is in the comment); images by digest; downloads by checksum.
# Dependabot (.github/dependabot.yml) proposes updates to all of them.

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:63e83b5a3dc36a917dccb76fe1bd2ac51f1ec9c1deb47ff20d4f04233bf6eae9
        env:
          POSTGRES_USER: laabam
          POSTGRES_PASSWORD: laabam
          POSTGRES_DB: laabam
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U laabam"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      LAABAM_TEST_PG: postgresql+psycopg://laabam:laabam@localhost:55432/postgres
      LAABAM_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - name: Known vulnerabilities in Python dependencies (pip-audit)
        run: |
          pip-audit -r requirements.txt --require-hashes --disable-pip --progress-spinner off
          pip-audit -r requirements-dev.txt --require-hashes --disable-pip --progress-spinner off
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Known vulnerabilities in npm dependencies (npm audit)
        run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run build
      - run: npm run build:preview

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the whole history, not just the last commit
          persist-credentials: false
      - name: gitleaks (binary checked against its published sha256)
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --redact --no-banner --verbose

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install --require-hashes -r backend/requirements.txt
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start the API (sandbox) serving the built app
        working-directory: backend
        # The suite starts more demo shops from one IP than the deployed limit (20 an hour, security plan C1)
        # allows, so this test server alone raises it. Deployed stacks keep 20.
        run: |
          LAABAM_SANDBOX=1 LAABAM_DATABASE_URL=sqlite:///e2e.db LAABAM_DEMO_SHOPS_PER_IP_HOUR=1000 \
            nohup python -m uvicorn laabam.app:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
      - run: npx playwright test
        working-directory: frontend
      - if: failure()
        run: cat backend/api.log

  image:
    runs-on: ubuntu-latest
    env:
      # Trivy by image digest (0.69.3); not the trivy-action, so no third-party action code runs here
      TRIVY: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t laabam:ci .
      - name: Smoke test (read-only root, no capabilities, non-root)
        run: |
          docker run -d --name smoke -p 8000:8000 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -e LAABAM_ENV=dev -e LAABAM_SANDBOX=1 \
            -e LAABAM_DATABASE_URL=sqlite:////tmp/laabam.db -e LAABAM_PHOTO_DIR=/tmp/photos laabam:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          test "$(docker exec smoke id -u)" = "10001"
          if curl -sI localhost:8000/api/health | grep -qi '^server:'; then echo 'Server header sent'; exit 1; fi
          docker rm -f smoke
      - name: Trivy - fixable HIGH/CRITICAL vulnerabilities in the image fail the build
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image --quiet
          --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 laabam:ci
      - name: Trivy - Dockerfile misconfigurations
        run: docker run --rm -v "$PWD:/src:ro" "$TRIVY" config --quiet --severity HIGH,CRITICAL --exit-code 1 /src/Dockerfile
      - name: SBOM (CycloneDX) of the image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" "$TRIVY" image --quiet
          --format cyclonedx --output /out/sbom.cdx.json laabam:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - name: CDK tests, including cdk-nag (AwsSolutions); no AWS calls
        run: npm test
      - name: Synth (CloudFormation only; nothing is deployed)
        run: npm run synth
