<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laabam · Listening</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#E9B866}a:hover{color:#F6DFB4}@keyframes lb-wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}@keyframes lb-dot{0%,100%{opacity:1}50%{opacity:.3}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F3D2A; color: #F1F5EE; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 24px 40px; gap: 24px; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700"><span style="width: 10px; height: 10px; border-radius: 50%; background: #F28B5B; animation: lb-dot 1.2s ease-in-out infinite"></span>Listening</span>
<a href="Counter.dc.html" style="height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid #2E5A45; display: flex; align-items: center; color: #F1F5EE; font-size: 15px; font-weight: 500; text-decoration: none">Cancel</a>
</div>
<p style="margin: 40px 0 0; font-family: Fraunces, Georgia, serif; font-size: 34px; font-weight: 500; line-height: 1.3">“Rice 200, sugar 100, oil 165<span style="color: #6E9C84">…</span>”</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="background: #1E5A3D; border-radius: 999px; padding: 8px 14px; font-size: 15px">Rice · ₹200</span>
<span style="background: #1E5A3D; border-radius: 999px; padding: 8px 14px; font-size: 15px">Sugar · ₹100</span>
<span style="background: #1E5A3D; border-radius: 999px; padding: 8px 14px; font-size: 15px">Oil · ₹165</span>
</div>
<div aria-hidden="true" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 72px; margin-top: auto">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="13"><span style="width: 6px; height: {{b.h}}px; border-radius: 3px; background: #E9B866; transform-origin: center; animation: lb-wave {{b.d}}s ease-in-out infinite"></span></sc-for>
</div>
<p style="margin: 0; font-size: 14px; color: #BFD3C5; text-align: center">Made a mistake? Just say it again: “sugar 120”.</p>
<a href="Checklist.dc.html" style="align-self: center; width: 172px; height: 172px; border-radius: 50%; background: #E9B866; color: #12261B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; box-shadow: 0 0 0 14px rgba(233,184,102,0.18)">
<svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
<span style="font-size: 17px; font-weight: 700">Let go to check</span>
</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const hs = [24, 40, 58, 36, 64, 48, 70, 44, 60, 32, 52, 38, 26];
    return { bars: hs.map((h, i) => ({ h, d: (0.7 + (i % 4) * 0.18).toFixed(2) })) };
  }
}
</script>
</body>
</html>
