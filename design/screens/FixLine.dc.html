<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laabam · Fix a line</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#157347}a:hover{color:#0F3D2A}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F1; color: #12261B; font-family: 'DM Sans', system-ui, sans-serif; position: relative; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 16px; padding: 56px 20px 0">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 600">Check the bill</h1>
<div style="background: #FFFFFF; border-radius: 20px; padding: 6px 16px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 14px; min-height: 58px; border-bottom: 1px solid #EEF2EC"><span style="flex: 1; font-size: 17px; font-weight: 500">Rice</span><span style="font-family: Fraunces, Georgia, serif; font-size: 20px; font-weight: 600">₹200</span></div>
<div style="display: flex; align-items: center; gap: 14px; min-height: 58px; border-bottom: 1px solid #EEF2EC"><span style="flex: 1; font-size: 17px; font-weight: 500">Sugar</span><span style="font-family: Fraunces, Georgia, serif; font-size: 20px; font-weight: 600">₹100</span></div>
<div style="display: flex; align-items: center; gap: 14px; min-height: 58px; margin: 0 -16px; padding: 0 16px; background: #FDF0DB"><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 500">Toor dal</span><span style="font-size: 13px; color: #9A4A10; font-weight: 700">Price needed</span></span><span style="font-size: 18px; font-weight: 700; color: #9A4A10">₹ ?</span></div>
</div>
<span style="display: flex; align-items: center; justify-content: center; height: 58px; border-radius: 16px; background: #C9D7C6; color: #4A5B50; font-size: 17px; font-weight: 700">Fix 1 line to continue</span>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(15,61,42,0.45)"></div>
<div role="dialog" aria-label="Add a price for toor dal" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 18px">
<span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #DCE6D9"></span>
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 600">How much for toor dal?</h2>
<p style="margin: 0; font-size: 15px; color: #5B6E60">You didn’t say a price, and Laabam hasn’t learned one yet.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; font-weight: 700">Quantity</span>
<span style="display: flex; align-items: center; justify-content: space-between; height: 54px; border: 1.5px solid #C9D7C6; border-radius: 14px; padding: 0 6px">
<button aria-label="Less" onClick="{{less}}" style="width: 44px; height: 44px; border: none; border-radius: 10px; background: #F1F5EE; font-size: 22px; color: #12261B">−</button>
<span style="font-size: 17px; font-weight: 700">{{qty}} kg</span>
<button aria-label="More" onClick="{{more}}" style="width: 44px; height: 44px; border: none; border-radius: 10px; background: #F1F5EE; font-size: 22px; color: #12261B">+</button>
</span></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; font-weight: 700">Amount (₹)</span><input type="text" inputmode="numeric" value="170" style="height: 54px; box-sizing: border-box; border: 2px solid #157347; border-radius: 14px; padding: 0 14px; font: 700 20px 'DM Sans', sans-serif; color: #12261B"></label>
</div>
<button style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 16px; border: 1.5px solid #C9D7C6; background: #FFFFFF; color: #12261B; font: 700 16px 'DM Sans', sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="2"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>Or hold and say it</button>
<div style="display: flex; gap: 10px">
<a href="Checklist.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #C9D7C6; color: #9A2F1C; font-size: 16px; font-weight: 700; text-decoration: none">Remove line</a>
<a href="Checklist.dc.html" style="flex: 2; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #157347; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">Save line</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { qty: 1 }; }
  renderVals() {
    const q = this.state.qty;
    return { qty: q, less: () => this.setState({ qty: Math.max(1, q - 1) }), more: () => this.setState({ qty: q + 1 }) };
  }
}
</script>
</body>
</html>
