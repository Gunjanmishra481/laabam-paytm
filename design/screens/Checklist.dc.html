<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laabam · Check the bill</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#157347}a:hover{color:#0F3D2A}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F1; color: #12261B; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 20px 28px; gap: 18px; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 600">Check the bill</h1>
<a href="Counter.dc.html" style="font-size: 15px; font-weight: 500; color: #5B6E60; text-decoration: none; padding: 12px 4px">Cancel</a>
</div>
<div style="display: flex; gap: 10px; align-items: flex-start; background: #E3ECE0; border-radius: 14px; padding: 12px 14px">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; margin-top: 2px"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="#157347" stroke-width="2"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0" fill="none" stroke="#157347" stroke-width="2" stroke-linecap="round"></path></svg>
<p style="margin: 0; font-size: 15px; line-height: 1.45"><span style="color: #5B6E60">You said</span> “rice 200, sugar 100, oil 165”</p>
</div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 6px 16px; display: flex; flex-direction: column">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
<label style="display: flex; align-items: center; gap: 14px; min-height: 64px; border-bottom: 1px solid #EEF2EC; cursor: pointer">
<input type="checkbox" checked="{{l.on}}" onChange="{{l.toggle}}" style="width: 24px; height: 24px; accent-color: #157347; flex: none">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 500; text-decoration: {{l.strike}}; color: {{l.color}}">{{l.name}}</span><span style="font-size: 13px; color: #5B6E60">{{l.note}}</span></span>
<span style="font-family: Fraunces, Georgia, serif; font-size: 20px; font-weight: 600; text-decoration: {{l.strike}}; color: {{l.color}}; font-variant-numeric: tabular-nums">{{l.amount}}</span>
</label>
</sc-for>
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 64px">
<span style="font-size: 17px; font-weight: 700">Total</span>
<span style="font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums">{{total}}</span>
</div>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5B6E60">Untick anything the customer didn’t take. Laabam remembers these prices, so next time just “rice” is enough.</p>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<a href="QR.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 58px; border-radius: 16px; background: #157347; color: #FFFFFF; font-size: 18px; font-weight: 700; text-decoration: none">Confirm {{total}}, show QR</a>
<a href="FixLine.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #C9D7C6; color: #12261B; font-size: 16px; font-weight: 700; text-decoration: none">Fix a line</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { off: {} }; }
  renderVals() {
    const items = [
      { id: 'rice', name: 'Rice', note: 'You said ₹200', paise: 20000 },
      { id: 'sugar', name: 'Sugar', note: 'You said ₹100', paise: 10000 },
      { id: 'oil', name: 'Sunflower oil 1 L', note: 'You said “oil”, ₹165', paise: 16500 }
    ];
    const rs = (p) => '₹' + (p / 100).toLocaleString('en-IN');
    let total = 0;
    const lines = items.map((it) => {
      const on = !this.state.off[it.id];
      if (on) total += it.paise;
      return { ...it, on, amount: rs(it.paise), strike: on ? 'none' : 'line-through', color: on ? '#12261B' : '#8A9A8F', toggle: () => this.setState({ off: { ...this.state.off, [it.id]: on } }) };
    });
    return { lines, total: rs(total) };
  }
}
</script>
</body>
</html>
