<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laabam · Soundbox screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 320px; height: 480px; box-sizing: border-box; background: #EEF1EC; font-family: 'DM Sans', system-ui, sans-serif; display: flex; align-items: center; justify-content: center">
<div style="width: 260px; background: #20262A; border-radius: 36px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 48px -20px rgba(0,0,0,0.5)">
<div style="background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #12261B">
<span style="font-size: 12px; color: #5B6E60">[Your shop]</span>
<span style="font-family: Fraunces, Georgia, serif; font-size: 34px; font-weight: 700; line-height: 1">₹465</span>
<svg width="126" height="126" viewBox="0 0 126 126" role="img" aria-label="QR code for ₹465"><g transform="scale(6)"><rect width="21" height="21" fill="#FFFFFF"></rect><g fill="#12261B"><rect x="0" y="0" width="7" height="7"></rect><rect x="14" y="0" width="7" height="7"></rect><rect x="0" y="14" width="7" height="7"></rect></g><g fill="#FFFFFF"><rect x="1" y="1" width="5" height="5"></rect><rect x="15" y="1" width="5" height="5"></rect><rect x="1" y="15" width="5" height="5"></rect></g><g fill="#12261B"><rect x="2" y="2" width="3" height="3"></rect><rect x="16" y="2" width="3" height="3"></rect><rect x="2" y="16" width="3" height="3"></rect><rect x="8" y="0" width="2" height="2"></rect><rect x="11" y="1" width="2" height="3"></rect><rect x="9" y="8" width="3" height="3"></rect><rect x="4" y="8" width="3" height="2"></rect><rect x="17" y="9" width="3" height="2"></rect><rect x="8" y="13" width="2" height="3"></rect><rect x="15" y="15" width="2" height="2"></rect><rect x="11" y="17" width="2" height="4"></rect><rect x="16" y="18" width="4" height="2"></rect></g></g></svg>
<span style="font-size: 12px; color: #5B6E60">Scan with any UPI app</span>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; padding: 4px 10px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="27"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3A4248; justify-self: center"></span></sc-for>
</div>
<div style="display: flex; align-items: center; gap: 8px; background: #2C3337; border-radius: 12px; padding: 10px 12px; color: #E9EDEA; font-size: 13px">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><path d="M4 9v6h4l5 4V5L8 9z" fill="none" stroke="#E9B866" stroke-width="2" stroke-linejoin="round"></path><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="#E9B866" stroke-width="2" stroke-linecap="round"></path></svg>
After payment: “₹465 received”
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":320,"height":480}}'>
class Component extends DCLogic {
  renderVals() { return { dots: Array.from({ length: 27 }, (_, i) => ({ i })) }; }
}
</script>
</body>
</html>
