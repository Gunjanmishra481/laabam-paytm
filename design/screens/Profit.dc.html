<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laabam · Profit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#157347}a:hover{color:#0F3D2A}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F1; color: #12261B; font-family: 'DM Sans', system-ui, sans-serif; position: relative; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 16px; padding: 52px 20px 104px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 600">Profit</h1>
<a href="Ask.dc.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DCE6D9; font-size: 15px; font-weight: 700; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="2"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>Ask why</a>
</div>
<div role="tablist" aria-label="Period" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #E3ECE0; border-radius: 14px; padding: 4px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height: 40px; border: none; border-radius: 10px; background: {{t.bg}}; color: #12261B; font: {{t.weight}} 15px 'DM Sans', sans-serif; box-shadow: {{t.shadow}}">{{t.label}}</button></sc-for>
</div>
<div style="background: #0F3D2A; color: #F1F5EE; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; color: #BFD3C5">Profit, about</span><span style="font-family: Fraunces, Georgia, serif; font-size: 42px; font-weight: 700; color: #E9B866; line-height: 1">{{p.profit}}</span></span>
<span style="display: flex; flex-direction: column; gap: 4px; text-align: right"><span style="font-size: 14px; color: #BFD3C5">from sales of</span><span style="font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600">{{p.sales}}</span></span>
</div>
<sc-if value="{{p.hasBars}}" hint-placeholder-val="{{ true }}">
<div aria-label="{{p.chartLabel}}" role="img" style="display: flex; align-items: flex-end; gap: 8px; height: 84px">
<sc-for list="{{p.bars}}" as="b" hint-placeholder-count="7"><span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 100%; height: {{b.h}}px; border-radius: 6px 6px 2px 2px; background: {{b.c}}"></span><span style="font-size: 11px; color: #BFD3C5">{{b.l}}</span></span></sc-for>
</div>
</sc-if>
<span style="font-size: 13px; line-height: 1.45; color: #BFD3C5">{{p.coverage}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #5B6E60">BY ITEM</span>
<div style="background: #FFFFFF; border-radius: 16px; padding: 2px 14px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; min-height: 50px; border-bottom: 1px solid #EEF2EC; gap: 10px"><span style="flex: 1; font-size: 15px; font-weight: 500">Toor dal</span><span style="font-size: 13px; color: #5B6E60">10.6%</span><span style="width: 70px; text-align: right; font-weight: 700">₹1,120</span></div>
<div style="display: flex; align-items: center; min-height: 50px; border-bottom: 1px solid #EEF2EC; gap: 10px"><span style="flex: 1; font-size: 15px; font-weight: 500">Biscuits</span><span style="font-size: 13px; color: #5B6E60">14.0%</span><span style="width: 70px; text-align: right; font-weight: 700">₹890</span></div>
<a href="ItemDetail.dc.html" style="display: flex; align-items: center; min-height: 50px; border-bottom: 1px solid #EEF2EC; gap: 10px; text-decoration: none; color: #12261B"><span style="flex: 1; font-size: 15px; font-weight: 500">Sunflower oil</span><span style="font-size: 13px; font-weight: 700; color: #9A2F1C">5.5% ↓</span><span style="width: 70px; text-align: right; font-weight: 700">₹410</span></a>
<a href="BillsIn.dc.html" style="display: flex; align-items: center; min-height: 50px; gap: 10px; text-decoration: none"><span style="flex: 1; font-size: 15px; color: #5B6E60">7 items with no cost yet</span><span style="font-size: 15px; font-weight: 700">Add a bill</span></a>
</div>
</div>
</div>
<div style="position: absolute; left: 0; bottom: 0; width: 390px"><dc-import name="TabBar" active="profit" hint-size="390px,88px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { period: 'week' }; }
  renderVals() {
    const data = {
      today: { profit: '₹760', sales: '₹8,400', hasBars: false, bars: [], chartLabel: '', coverage: 'Counts 86% of today’s UPI payments. The rest weren’t billed by voice, so their profit isn’t known.' },
      week: { profit: '₹4,980', sales: '₹52,300', hasBars: true, chartLabel: 'Profit by day this week, highest ₹830', coverage: 'Counts 88% of this week’s UPI payments. Figures are illustrative.', vals: [620, 710, 540, 830, 760, 690, 830], labels: ['F', 'S', 'S', 'M', 'T', 'W', 'T'] },
      month: { profit: '₹19,800', sales: '₹2,10,500', hasBars: true, chartLabel: 'Profit by week this month', coverage: 'Counts 87% of this month’s UPI payments. Figures are illustrative.', vals: [4600, 5100, 5120, 4980], labels: ['W1', 'W2', 'W3', 'W4'] }
    };
    const p = { ...data[this.state.period] };
    if (p.vals) { const max = Math.max(...p.vals); p.bars = p.vals.map((v, i) => ({ h: Math.round(60 * v / max), l: p.labels[i], c: i === p.vals.length - 1 ? '#E9B866' : '#2E7A55' })); }
    const tabs = [['today', 'Today'], ['week', 'This week'], ['month', 'Month']].map(([id, label]) => {
      const on = this.state.period === id;
      return { label, on, bg: on ? '#FFFFFF' : 'transparent', weight: on ? 700 : 500, shadow: on ? '0 1px 3px rgba(18,38,27,0.15)' : 'none', pick: () => this.setState({ period: id }) };
    });
    return { p, tabs };
  }
}
</script>
</body>
</html>
