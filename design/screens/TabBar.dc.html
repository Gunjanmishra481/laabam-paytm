<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laabam · Tab bar</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width: 390px; height: 88px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #DCE6D9; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 20px; font-family: 'DM Sans', system-ui, sans-serif">
<a href="Counter.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{c.counter}}; font-size: 12px; font-weight: {{w.counter}}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="2"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>Counter</a>
<a href="BillsIn.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{c.bills}}; font-size: 12px; font-weight: {{w.bills}}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"></circle></svg>Bills in</a>
<a href="Profit.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{c.profit}}; font-size: 12px; font-weight: {{w.profit}}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>Profit</a>
<a href="Plan.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{c.plan}}; font-size: 12px; font-weight: {{w.plan}}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"></rect><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>Plan</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["counter","bills","profit","plan"],"default":"counter"},"$preview":{"width":390,"height":88}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'counter';
    const c = {}, w = {};
    ['counter', 'bills', 'profit', 'plan'].forEach((k) => { c[k] = k === a ? '#157347' : '#5B6E60'; w[k] = k === a ? 700 : 500; });
    return { c, w };
  }
}
</script>
</body>
</html>
