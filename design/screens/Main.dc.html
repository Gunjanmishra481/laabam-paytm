<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laabam · Welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#157347}a:hover{color:#0F3D2A}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F3D2A; color: #F1F5EE; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 64px 24px 32px; gap: 28px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px">
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#E9B866"></rect><path d="M10 27l7-7 5 4 8-10" fill="none" stroke="#0F3D2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path><path d="M24 14h6v6" fill="none" stroke="#0F3D2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 700">Laabam</span>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; margin-top: 24px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 40px; font-weight: 600; line-height: 1.1; letter-spacing: -0.5px">See what your shop really earns.</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #BFD3C5">Bill by voice, photograph your distributor bills, and Laabam works out the profit.</p>
</div>
<fieldset style="margin: auto 0 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 14px; font-weight: 700; letter-spacing: 1px; color: #E9B866; margin-bottom: 12px">CHOOSE YOUR LANGUAGE</legend>
<sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
<label style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 18px; border-radius: 16px; background: {{l.bg}}; color: {{l.fg}}; border: 2px solid {{l.border}}; cursor: pointer">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 19px; font-weight: 700">{{l.native}}</span><span style="font-size: 13px; opacity: 0.8">{{l.english}}</span></span>
<input type="radio" name="lang" checked="{{l.checked}}" onChange="{{l.pick}}" style="width: 22px; height: 22px; accent-color: #157347">
</label>
</sc-for>
<p style="margin: 4px 0 0; font-size: 14px; color: #BFD3C5">You can change this any time in Settings.</p>
</fieldset>
<a href="Setup.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #E9B866; color: #12261B; font-size: 18px; font-weight: 700; text-decoration: none">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { lang: 'en' }; }
  renderVals() {
    const all = [
      { id: 'en', native: 'English', english: 'English' },
      { id: 'ta', native: 'தமிழ்', english: 'Tamil' },
      { id: 'hi', native: 'हिन्दी', english: 'Hindi' }
    ];
    return {
      langs: all.map((l) => {
        const on = this.state.lang === l.id;
        return { ...l, checked: on, bg: on ? '#F1F5EE' : 'transparent', fg: on ? '#12261B' : '#F1F5EE', border: on ? '#F1F5EE' : '#2E5A45', pick: () => this.setState({ lang: l.id }) };
      })
    };
  }
}
</script>
</body>
</html>
