<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laabam · Festival plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#157347}a:hover{color:#0F3D2A}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F1; color: #12261B; font-family: 'DM Sans', system-ui, sans-serif; position: relative; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 52px 20px 104px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 600">Deepavali stock</h1>
<span style="font-size: 14px; font-weight: 700; color: #9A4A10">in 9 days</span>
</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; line-height: 1.4">Stock for how busy a week? <span style="color: #5B6E60">This is a guess you can change.</span></span>
<div role="radiogroup" aria-label="Expected sales compared with a normal week" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{mults}}" as="m" hint-placeholder-count="3"><button role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="height: 44px; border-radius: 12px; border: 1.5px solid {{m.border}}; background: {{m.bg}}; color: {{m.fg}}; font: 700 15px 'DM Sans', sans-serif">{{m.label}}</button></sc-for>
</div>
</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 2px 14px; display: flex; flex-direction: column">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 10px; min-height: 50px; border-bottom: 1px solid #EEF2EC"><span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 500">{{l.name}}</span><span style="font-size: 12px; color: #5B6E60">{{l.note}}</span></span><span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{l.amt}}</span></div>
</sc-for>
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 52px"><span style="font-size: 16px; font-weight: 700">Order total</span><span style="font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 700">{{total}}</span></div>
</div>
<div style="background: #0F3D2A; color: #F1F5EE; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; font-size: 15px"><span>Cash in hand <a href="Settings.dc.html" style="color: #E9B866; font-weight: 700">Edit</a></span><span style="font-weight: 700">₹15,000</span></div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px">Short by</span><span style="font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: 700; color: #E9B866">{{short}}</span></div>
<a href="Loan.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 14px; background: #E9B866; color: #12261B; font-size: 16px; font-weight: 700; text-decoration: none">See a loan offer for {{short}}</a>
</div>
</div>
<div style="position: absolute; left: 0; bottom: 0; width: 390px"><dc-import name="TabBar" active="plan" hint-size="390px,88px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { m: 2 }; }
  renderVals() {
    const m = this.state.m, k = m / 2;
    const rs = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
    const base = [
      ['Sunflower oil 1 L', 'Kumar Traders, ₹149 a litre', 8940],
      ['Toor dal', 'Sri Balaji', 6080],
      ['Biscuits', 'Sri Balaji', 3440],
      ['Ghee 200 ml', 'Sri Balaji', 3540],
      ['Sugar', 'Kumar Traders', 2100],
      ['22 more items', 'Tap to see all', 15900]
    ];
    const total = 40000 * k;
    return {
      lines: base.map(([name, note, v]) => ({ name, note, amt: rs(v * k) })),
      total: rs(total),
      short: rs(Math.max(0, total - 15000)),
      mults: [1.5, 2, 2.5].map((v) => { const on = v === m; return { label: v + '× usual', on, bg: on ? '#157347' : '#FFFFFF', fg: on ? '#FFFFFF' : '#12261B', border: on ? '#157347' : '#C9D7C6', pick: () => this.setState({ m: v }) }; })
    };
  }
}
</script>
</body>
</html>
